name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: oven-sh/setup-bun@v2
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked
      - run: make lint
      - run: make smoke
      - run: uv tool install . && trading-r1 --version
